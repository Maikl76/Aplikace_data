{% extends "base.html" %}
{% block content_anon %}
<div class="card p-6">
  <h1 class="text-lg font-semibold mb-1">Přihlášení</h1>
  <p class="text-sm text-muted mb-5">Laboratoř funkční diagnostiky</p>

  {% if form.non_field_errors %}
    <div class="mb-4 px-3 py-2 rounded-lg text-sm badge-bad" style="display:block">
      Uživatelské jméno nebo heslo nesedí. Pozor na velká a malá písmena.
    </div>
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <label class="block">
      <span class="text-sm text-2">Uživatelské jméno</span>
      {{ form.username }}
    </label>
    <label class="block">
      <span class="text-sm text-2">Heslo</span>
      {{ form.password }}
    </label>
    <button type="submit" class="btn btn-primary w-full">Přihlásit</button>
  </form>
</div>
{% endblock %}
