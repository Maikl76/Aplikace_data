<fieldset class="{{ cls }}">
  <legend class="text-sm font-medium">{{ f.label|capfirst }}</legend>
  {% if hint %}<p class="text-xs text-muted mb-2">{{ hint }}</p>{% endif %}
  <div class="max-h-56 overflow-y-auto grid sm:grid-cols-2 gap-x-4 gap-y-1 text-sm p-2 rounded-lg" style="background: var(--surface-2)">
    {% for c in f %}<label class="flex items-start gap-2">{{ c.tag }} <span>{{ c.choice_label }}</span></label>{% empty %}<span class="text-muted">nic k výběru</span>{% endfor %}
  </div>
</fieldset>
