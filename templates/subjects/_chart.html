{% load charts %}
{# Jedna figura: nadpis, slovní shrnutí, graf, zdroj normy. #}
<figure class="card p-4 m-0">
  <figcaption class="mb-2">
    <span class="card-title">{{ spec.title }}</span>
    {% if spec.subtitle %}
      <span class="block text-sm text-2">{{ spec.subtitle }}</span>
    {% endif %}
  </figcaption>
  <div class="js-graf overflow-x-auto" data-target="{{ spec.element_id }}">
    <div id="{{ spec.element_id }}"></div>
    <script type="application/json" id="{{ spec.element_id }}-data">{{ spec.figure|figure_json }}</script>
    {% if spec.figure_dark %}
      <script type="application/json" id="{{ spec.element_id }}-data-dark">{{ spec.figure_dark|figure_json }}</script>
    {% endif %}
  </div>
  {% if spec.note %}
    <p class="mt-2 text-xs text-muted">{{ spec.note }}</p>
  {% endif %}
</figure>
