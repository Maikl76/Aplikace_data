{% extends "base.html" %}
{% load ui %}
{% block content %}
<div class="flex flex-wrap items-end justify-between gap-3 mb-5">
  <div>
    <div class="eyebrow">Měření</div>
    <h1 class="text-2xl font-semibold">Testovací dny</h1>
  </div>
  <div class="flex flex-wrap gap-2">
    <a href="{% url 'today' %}" class="btn">{% icon "calendar" %}Dnešní testování</a>
    <a href="{% url 'session_create' %}" class="btn btn-primary">{% icon "plus" %}Nový testovací den</a>
  </div>
</div>

<form class="card p-3 mb-4" hx-get="{% url 'session_list' %}" hx-trigger="input delay:250ms"
      hx-target="#dny" onsubmit="return false">
  <div class="relative max-w-md">
    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted">{% icon "search" "w-4 h-4" %}</span>
    <input type="search" name="q" value="{{ q }}" placeholder="Sportovec (jméno nebo kód)…" class="input pl-9">
  </div>
</form>

<div class="card overflow-x-auto">
  <table class="table">
    <thead>
      <tr><th>Datum</th><th>Sportovec</th><th>Testy</th><th class="text-right">Změřeno</th><th class="max-md:hidden">Operátor</th></tr>
    </thead>
    <tbody id="dny">{% include "measurements/_session_rows.html" %}</tbody>
  </table>
</div>
{% endblock %}
