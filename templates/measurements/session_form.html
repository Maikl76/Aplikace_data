{% extends "base.html" %}
{% load ui %}
{% block content %}
<div class="mb-5">
  <div class="eyebrow">Měření</div>
  <h1 class="text-2xl font-semibold">Nový testovací den</h1>
</div>
<form method="post" class="card p-5 max-w-2xl space-y-4">
  {% csrf_token %}
  {% for field in form %}
    {% if field.name == "protocols" %}
      {% include "measurements/_protocol_choices.html" %}
    {% else %}
      <label class="block">
        <span class="text-sm text-2">{{ field.label }}</span>
        {% if field.name == "subject" %}
          <select name="subject" class="input mt-1" required
                  hx-get="{% url 'session_battery' %}" hx-target="#testy" hx-swap="outerHTML"
                  hx-trigger="change">
            {% for value, label in field.field.choices %}
              <option value="{{ value }}" {% if value|stringformat:"s" == field.value|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        {% else %}
          <div class="mt-1">{{ field }}</div>
        {% endif %}
        {% if field.help_text %}<span class="text-xs text-muted">{{ field.help_text }}</span>{% endif %}
        {% for error in field.errors %}<span class="text-xs" style="color: var(--bad)">{{ error }}</span>{% endfor %}
      </label>
    {% endif %}
  {% endfor %}
  <button type="submit" class="btn btn-primary">Založit testovací den</button>
</form>
{% endblock %}
