  <style>
    /* Samostatný styl: zpráva se tiskne a posílá, nesmí záviset na aplikaci. */
    @page { size: A4; margin: 20mm 18mm; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           font-size: 10.5pt; line-height: 1.5; color: #0b0b0b; }
    h1 { font-size: 16pt; margin: 0 0 2mm; }
    h2 { font-size: 12pt; margin: 7mm 0 2mm; }
    .hlavicka { border-bottom: 2px solid #0b0b0b; padding-bottom: 3mm; margin-bottom: 5mm; }
    .meta { color: #52514e; font-size: 9.5pt; }
    table { width: 100%; border-collapse: collapse; margin: 2mm 0; }
    th, td { text-align: left; padding: 1.5mm 2mm; border-bottom: 1px solid #e1e0d9; }
    th { color: #52514e; font-weight: 600; font-size: 9.5pt; }
    td.cislo { text-align: right; font-variant-numeric: tabular-nums; }
    .nalez { margin: 0 0 2mm; padding-left: 4mm; border-left: 3px solid #c3c2b7; }
    .nalez.high { border-left-color: #d03b3b; }
    .nalez.medium { border-left-color: #fab219; }
    .zavaznost { font-size: 9pt; color: #52514e; }
    .potlaceno { background: #f0efec; padding: 3mm; margin: 2mm 0; }
    .dolozka { margin-top: 8mm; padding: 4mm; border: 1px solid #c3c2b7;
               font-size: 9.5pt; }
    .citace { font-size: 9.5pt; list-style: none; padding-left: 0; }
    .citace li { margin-bottom: 1.5mm; }
    .upozorneni { color: #8a5a00; font-size: 9.5pt; }
    .protokol { margin: 4mm 0 1mm; font-size: 11pt; font-weight: 600; }
    .protokol-meta { color: #52514e; font-size: 9pt; font-weight: normal; }
    table.vysledky { font-size: 9.5pt; }
    table.vysledky th, table.vysledky td { padding: 1.2mm 1.5mm; vertical-align: top; }
    table.vysledky tr { break-inside: avoid; }
    .upresneni { color: #52514e; font-size: 8.5pt; }
    .pokusy { color: #898781; font-size: 8.5pt; }
    .klicova { font-weight: 600; }
    table.vysledky tr:has(td.pokracovani) td { border-top: 0; }
    td.pokracovani { padding-left: 4mm; }
    .posouzeni { white-space: nowrap; }
    .posouzeni.worse { font-weight: 600; }
    .ods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; margin: 2mm 0 1mm;
           break-inside: avoid; }
    .ods-sloupec { border: 1px solid #e1e0d9; border-radius: 2mm; padding: 2mm 2.5mm; }
    .ods-nadpis { font-weight: 600; font-size: 9.5pt; margin-bottom: 1mm; }
    .ods-nadpis span { font-weight: normal; color: #52514e; font-size: 8.5pt; }
    .ods-radek { display: flex; justify-content: space-between; gap: 2mm; font-size: 9pt;
                 margin-top: 1mm; }
    .ods-text { font-size: 9.5pt; margin: 1mm 0 2mm; }
    .rozptyl { color: #8a5a00; }
    .grafy { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm 6mm; }
    figure { margin: 0; break-inside: avoid; }
    figcaption { font-size: 9pt; color: #52514e; margin-top: 1mm; }
    .graf-nazev { font-size: 10pt; font-weight: 600; margin-bottom: 1mm; }
    .graf-nazev span { font-weight: normal; color: #52514e; font-size: 9pt; }
    .vysvetlivka { font-size: 8.5pt; color: #52514e; margin-top: 2mm; }
    .doporuceni li { margin-bottom: 1.5mm; }
    .prazdne { color: #52514e; font-style: italic; }
    h2 { break-after: avoid; }
    @media screen { body { max-width: 190mm; margin: 10mm auto; padding: 0 16px; } }
    @media (max-width: 640px) { .grafy { grid-template-columns: 1fr; } }
    footer { margin-top: 8mm; font-size: 8.5pt; color: #898781;
             border-top: 1px solid #e1e0d9; padding-top: 2mm; }
  </style>
