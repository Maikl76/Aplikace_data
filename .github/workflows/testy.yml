# Testy a kontrola kódu při každé změně – to, co slibuje docs/aktualizace-serveru.md.
# Výsledek je vidět u každé změny (zelená/červená) a v pull requestu.

name: Testy

on:
  push:
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: sqlite:///ci.sqlite3
      DJANGO_SECRET_KEY: jen-pro-testy-v-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Knihovny
        run: python -m pip install -r requirements/dev.txt

      - name: Kontrola kódu (ruff)
        run: ruff check .

      - name: Migrace odpovídají modelům
        run: python manage.py makemigrations --check --dry-run

      - name: Testy
        run: python -m pytest -q -p no:warnings
