[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
# Sbírat jen funkce – jinak pytest zkouší kolektovat TestFamily z katalogu.
python_classes = ["*TestCase"]
