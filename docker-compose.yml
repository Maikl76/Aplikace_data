# Vývojové prostředí. Stejné služby jako na serveru – proto se nasazení
# obejde bez přepisování. Rozdíly jsou jen v docker-compose.prod.yml.
# Fronta úloh ani objektové úložiště nejsou potřeba: model píše ve vlákně
# aplikace, soubory jsou na disku ve složce media.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ftvs
      POSTGRES_PASSWORD: ftvs
      POSTGRES_DB: ftvs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftvs"]
      interval: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
