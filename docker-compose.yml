# Vývojové prostředí. Stejné služby jako na serveru – proto se nasazení
# obejde bez přepisování. Rozdíly jsou jen v docker-compose.prod.yml.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ftvs
      POSTGRES_PASSWORD: ftvs
      POSTGRES_DB: ftvs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftvs"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  miniodata:
